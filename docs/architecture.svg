<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 820" width="1260" height="820" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">SuryaDash — high-level architecture</title>
<desc id="d">An ESP32 reads sensors and drives relays in the field. It exchanges data with a Firebase Realtime Database protected by security rules. A browser app polls the database over REST, signs users in with Firebase Authentication, and is served by Firebase Hosting.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474F"/></marker></defs>
<rect width="1260" height="820" fill="#FFFFFF"/>
<text x="24" y="38" font-size="22" font-weight="700" fill="#1F3864">SuryaDash — high-level architecture</text>
<rect x="20" y="70" width="280" height="650" rx="14" fill="#FFF8E7" stroke="#E69500" stroke-width="2"/>
<text x="36" y="98" font-size="13" font-weight="700" letter-spacing="1" fill="#E69500">FIELD · HARDWARE</text>
<rect x="400" y="70" width="320" height="650" rx="14" fill="#EAF4FD" stroke="#1E73BE" stroke-width="2"/>
<text x="416" y="98" font-size="13" font-weight="700" letter-spacing="1" fill="#1E73BE">CLOUD · FIREBASE PROJECT</text>
<rect x="880" y="70" width="350" height="650" rx="14" fill="#EDF7EE" stroke="#2E7D32" stroke-width="2"/>
<text x="896" y="98" font-size="13" font-weight="700" letter-spacing="1" fill="#2E7D32">CLIENT · BROWSER (VANILLA JS)</text>
<rect x="40" y="120" width="240" height="90" rx="9" fill="#FFFFFF" stroke="#E69500" stroke-width="1.5"/>
<text x="52" y="142" font-size="13.5" font-weight="700" fill="#263238">Sensors</text>
<text x="52" y="161" font-size="12" font-weight="400" fill="#263238">4× DS18B20  →  T1 T2 T3 T4</text>
<text x="52" y="178" font-size="12" font-weight="400" fill="#263238">2× YF-S201  →  F1 F2</text>
<rect x="40" y="260" width="240" height="110" rx="9" fill="#FFFFFF" stroke="#E69500" stroke-width="1.5"/>
<text x="52" y="282" font-size="13.5" font-weight="700" fill="#263238">ESP32 firmware</text>
<text x="52" y="301" font-size="12" font-weight="400" fill="#263238">reads sensors, pushes data</text>
<text x="52" y="318" font-size="12" font-weight="400" fill="#263238">pulls controls, drives relays</text>
<text x="52" y="335" font-size="12" font-weight="400" fill="#263238">main loop every 2 s</text>
<rect x="40" y="420" width="240" height="80" rx="9" fill="#FFFFFF" stroke="#E69500" stroke-width="1.5"/>
<text x="52" y="442" font-size="13.5" font-weight="700" fill="#263238">Relay board ×4</text>
<text x="52" y="461" font-size="12" font-weight="400" fill="#263238">power · solenoid · pump · lamp</text>
<rect x="40" y="550" width="240" height="80" rx="9" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="52" y="572" font-size="13.5" font-weight="700" fill="#263238">Solar collector loop</text>
<text x="52" y="591" font-size="12" font-weight="400" fill="#263238">absorber · pipes · pump · tank</text>
<line x1="160" y1="210" x2="160" y2="260" stroke="#37474F" stroke-width="2" marker-end="url(#ar)"/>
<rect x="105.0" y="225" width="110" height="20" rx="10" fill="#FFFFFF" stroke="#B0BEC5"/>
<text x="160" y="239" font-size="11" text-anchor="middle" fill="#37474F">OneWire / pulses</text>
<line x1="160" y1="370" x2="160" y2="420" stroke="#37474F" stroke-width="2" marker-end="url(#ar)"/>
<rect x="135.0" y="385" width="50" height="20" rx="10" fill="#FFFFFF" stroke="#B0BEC5"/>
<text x="160" y="399" font-size="11" text-anchor="middle" fill="#37474F">GPIO</text>
<line x1="160" y1="500" x2="160" y2="550" stroke="#37474F" stroke-width="2" marker-end="url(#ar)"/>
<rect x="110.0" y="515" width="100" height="20" rx="10" fill="#FFFFFF" stroke="#B0BEC5"/>
<text x="160" y="529" font-size="11" text-anchor="middle" fill="#37474F">switches loads</text>
<rect x="420" y="120" width="280" height="70" rx="9" fill="#FFFFFF" stroke="#1E73BE" stroke-width="1.5"/>
<text x="432" y="142" font-size="13.5" font-weight="700" fill="#263238">Firebase Hosting</text>
<text x="432" y="161" font-size="12" font-weight="400" fill="#263238">static files · CDN · HTTPS · 404.html</text>
<rect x="420" y="215" width="280" height="60" rx="9" fill="#FFFFFF" stroke="#1E73BE" stroke-width="1.5"/>
<text x="432" y="237" font-size="13.5" font-weight="700" fill="#263238">Firebase Authentication</text>
<text x="432" y="256" font-size="12" font-weight="400" fill="#263238">email + password · ID tokens</text>
<rect x="420" y="295" width="280" height="305" rx="9" fill="#FFFFFF" stroke="#1E73BE" stroke-width="1.5"/>
<text x="432" y="318" font-size="13.5" font-weight="700" fill="#263238">Realtime Database (REST API)</text>
<text x="432" y="343" font-size="12" font-family="Menlo, Consolas, monospace" fill="#37474F">/sites/&lt;id&gt;/meta</text>
<text x="432" y="363" font-size="12" font-family="Menlo, Consolas, monospace" fill="#37474F">/sites/&lt;id&gt;/sensors   ← device writes</text>
<text x="432" y="383" font-size="12" font-family="Menlo, Consolas, monospace" fill="#37474F">/sites/&lt;id&gt;/controls  ← user writes</text>
<text x="432" y="403" font-size="12" font-family="Menlo, Consolas, monospace" fill="#37474F">/sites/&lt;id&gt;/members · devices</text>
<text x="432" y="423" font-size="12" font-family="Menlo, Consolas, monospace" fill="#37474F">/users/&lt;uid&gt;/sites</text>
<rect x="432" y="462" width="256" height="126" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5"/>
<text x="444" y="484" font-size="13" font-weight="700" fill="#BF360C" >Security rules</text>
<text x="444" y="503" font-size="12" font-weight="400" fill="#BF360C" >deny by default</text>
<text x="444" y="522" font-size="12" font-weight="400" fill="#BF360C" >per-field range validation</text>
<text x="444" y="541" font-size="12" font-weight="400" fill="#BF360C" >roles: owner · member · device</text>
<text x="444" y="560" font-size="12" font-weight="400" fill="#BF360C" >unknown keys rejected</text>
<rect x="900" y="120" width="310" height="50" rx="9" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
<text x="912" y="142" font-size="13.5" font-weight="700" fill="#263238">Static app + PWA</text>
<text x="912" y="160" font-size="12" fill="#263238">index.html · CSS · manifest · service worker</text>
<rect x="900" y="215" width="310" height="115" rx="9" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
<text x="912" y="237" font-size="13.5" font-weight="700" fill="#263238">Data access</text>
<text x="912" y="256" font-size="12" font-weight="400" fill="#263238">firebase-rest.js — poll, write</text>
<text x="912" y="273" font-size="12" font-weight="400" fill="#263238">auth.js — sign-in, token refresh</text>
<text x="912" y="290" font-size="12" font-weight="400" fill="#263238">site-manager.js — multi-site</text>
<rect x="900" y="355" width="310" height="75" rx="9" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
<text x="912" y="377" font-size="13.5" font-weight="700" fill="#263238">Domain logic</text>
<text x="912" y="396" font-size="12" font-weight="400" fill="#263238">solar-physics · roi · analytics · alarms</text>
<rect x="900" y="455" width="310" height="65" rx="9" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
<text x="912" y="477" font-size="13.5" font-weight="700" fill="#263238">Orchestrator — app.js</text>
<text x="912" y="496" font-size="12" font-weight="400" fill="#263238">boot · demo fallback · settings · KPIs</text>
<rect x="900" y="545" width="310" height="65" rx="9" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
<text x="912" y="567" font-size="13.5" font-weight="700" fill="#263238">Presentation</text>
<text x="912" y="586" font-size="12" font-weight="400" fill="#263238">charts.js · ux-polish.js · consent.js</text>
<rect x="900" y="635" width="310" height="65" rx="9" fill="#F1F8E9" stroke="#2E7D32" stroke-width="1.5"/>
<text x="912" y="657" font-size="13.5" font-weight="700" fill="#263238">Browser storage (localStorage)</text>
<text x="912" y="676" font-size="12" font-weight="400" fill="#263238">session · settings · site · consent · kWh</text>
<line x1="280" y1="320" x2="420" y2="320" stroke="#37474F" stroke-width="2" marker-end="url(#ar)"/>
<rect x="281.0" y="296" width="138" height="20" rx="10" fill="#FFFFFF" stroke="#B0BEC5"/>
<text x="350" y="310" font-size="11" text-anchor="middle" fill="#37474F">PATCH /sensors · 2 s</text>
<line x1="420" y1="350" x2="280" y2="350" stroke="#37474F" stroke-width="2" marker-end="url(#ar)"/>
<rect x="286.0" y="356" width="128" height="20" rx="10" fill="#FFFFFF" stroke="#B0BEC5"/>
<text x="350" y="370" font-size="11" text-anchor="middle" fill="#37474F">GET /controls · 2 s</text>
<line x1="700" y1="155" x2="900" y2="155" stroke="#37474F" stroke-width="2" marker-end="url(#ar)"/>
<rect x="745.0" y="131" width="110" height="20" rx="10" fill="#FFFFFF" stroke="#B0BEC5"/>
<text x="800" y="145" font-size="11" text-anchor="middle" fill="#37474F">serves app files</text>
<line x1="900" y1="240" x2="700" y2="240" stroke="#37474F" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="729.0" y="216" width="142" height="20" rx="10" fill="#FFFFFF" stroke="#B0BEC5"/>
<text x="800" y="230" font-size="11" text-anchor="middle" fill="#37474F">sign-in · token refresh</text>
<line x1="700" y1="310" x2="900" y2="310" stroke="#37474F" stroke-width="2" marker-end="url(#ar)"/>
<rect x="711.0" y="286" width="178" height="20" rx="10" fill="#FFFFFF" stroke="#B0BEC5"/>
<text x="800" y="300" font-size="11" text-anchor="middle" fill="#37474F">GET sensors + controls · 2 s</text>
<line x1="900" y1="330" x2="700" y2="330" stroke="#37474F" stroke-width="2" marker-end="url(#ar)"/>
<rect x="720.0" y="337" width="160" height="20" rx="10" fill="#FFFFFF" stroke="#B0BEC5"/>
<text x="800" y="351" font-size="11" text-anchor="middle" fill="#37474F">PUT /controls/&lt;key&gt; on click</text>
<rect x="880" y="735" width="350" height="56" rx="9" fill="#FAFAFA" stroke="#9E9E9E" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="892" y="757" font-size="13.5" font-weight="700" fill="#263238">External (browser loads)</text>
<text x="892" y="778" font-size="11.5" fill="#455A64">Chart.js 4.4.1 · Google Fonts · GA4 (optional, consent-gated)</text>
<text x="24" y="752" font-size="12" fill="#455A64">Trust boundary: the browser and the device are both untrusted clients — the security rules in Firebase are the only enforcement point.</text>
<text x="24" y="774" font-size="12" fill="#455A64">Latency: a control change reaches the relays within one device poll (~2 s); dashboard values refresh every poll interval (default 2 s).</text>
<text x="24" y="796" font-size="12" fill="#455A64">Polling over the REST API — no Firebase SDK, no WebSocket. Alarms are evaluated in the browser while a tab is open.</text>
</svg>